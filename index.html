<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>خطتي اليومية</title>
<meta name="theme-color" content="#6b4fd3">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="خطتي">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3f1fa;--sf:#fff;--ink:#231f3a;--mut:#6b6788;--ln:#ddd8ee;--ac:#6b4fd3;--aci:#fff;--ok:#1f9a7b;--st:#f2b01e;--bad:#c2402d;color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#15121f;--sf:#1f1b2e;--ink:#ece9f7;--mut:#a29fbd;--ln:#332e4a;--ac:#9a85f0;--aci:#15121f;--ok:#4fd1ae;--st:#f5c04a;--bad:#ff8c78;color-scheme:dark}}
:root[data-theme=dark]{--bg:#15121f;--sf:#1f1b2e;--ink:#ece9f7;--mut:#a29fbd;--ln:#332e4a;--ac:#9a85f0;--aci:#15121f;--ok:#4fd1ae;--st:#f5c04a;--bad:#ff8c78;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 Tajawal,Tahoma,sans-serif;padding:env(safe-area-inset-top,0) 0 calc(72px + env(safe-area-inset-bottom,0))}
main{max-width:640px;margin:0 auto;padding:12px}
h2{margin:6px 0 12px;font-size:1.3rem}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:14px;padding:12px;margin-bottom:12px}
.card p{margin:2px 0}
.btn{border:1px solid var(--ln);background:var(--sf);color:var(--ink);border-radius:10px;padding:8px 14px;min-height:44px;font:inherit;cursor:pointer}
.btn.pri{background:var(--ac);border-color:var(--ac);color:var(--aci);font-weight:700}
.btn.bad{color:var(--bad)}
.ib{width:44px;height:44px;border:1px solid var(--ln);background:var(--sf);color:var(--ink);border-radius:10px;font-size:1.2rem;cursor:pointer;flex:none}
.ib.sm{width:36px;height:36px;font-size:1rem}
.ib:disabled{opacity:.35}
input,select,textarea{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--ln);border-radius:8px;padding:6px 8px;min-height:40px;max-width:100%}
:focus-visible{outline:3px solid var(--st);outline-offset:2px}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}
.dt{text-align:center;display:flex;flex-direction:column}.dt small{color:var(--mut)}
.sum{display:flex;gap:14px;align-items:center}
.ring{width:110px;height:110px;flex:none}.rb{fill:none;stroke:var(--ln);stroke-width:9}.rf{fill:none;stroke:var(--ok);stroke-width:9;stroke-linecap:round;transition:stroke-dashoffset .4s}.rt{font-size:20px;font-weight:700;fill:var(--ink)}
.chips{display:flex;gap:6px;overflow-x:auto;margin-bottom:10px}
.chip{border:1px solid var(--ln);background:var(--sf);color:var(--ink);border-radius:99px;padding:4px 14px;min-height:36px;white-space:nowrap;font:inherit;cursor:pointer}
.chip[aria-pressed=true]{background:var(--ac);color:var(--aci);border-color:var(--ac)}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:8px;background:var(--sf);border:1px solid var(--ln);border-radius:12px;padding:8px 10px;margin-bottom:8px}
.row.dn{border-color:var(--ok)}
.ck{width:26px;height:26px;accent-color:var(--ok);flex:none}
.mid{flex:1;min-width:120px;display:flex;flex-direction:column}.mid small{color:var(--mut)}
.pt{display:flex;align-items:center;gap:4px;white-space:nowrap}.pt input{width:64px;text-align:center}.pt span{color:var(--mut)}
.ex{width:100%;display:flex;gap:10px;align-items:center;flex-wrap:wrap;color:var(--mut);font-size:.9rem}
.tm{font-size:4.2rem;font-weight:700;text-align:center;direction:ltr;font-variant-numeric:tabular-nums;line-height:1.2;margin:8px 0}
.mode{text-align:center;color:var(--mut);margin:0}
.rw{display:flex;gap:8px;flex-wrap:wrap}.rw.c{justify-content:center}
label.f{display:flex;flex-direction:column;gap:2px;font-size:.9rem;flex:1;min-width:110px}
label.f input,label.f select,label.f textarea{width:100%}
.bars{display:flex;gap:4px;height:150px;margin-bottom:10px}
.bc{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;min-width:0}
.bw{flex:1;width:100%;display:flex;align-items:flex-end;background:var(--bg);border-radius:6px;overflow:hidden}
.bw i{display:block;width:100%;background:var(--ac);min-height:2px}.bw i.top{background:var(--st)}
.bc small{font-size:.7rem;color:var(--mut)}
table{width:100%;border-collapse:collapse}td,th{padding:6px 4px;border-bottom:1px solid var(--ln);text-align:start}
.dsel{display:flex;gap:4px;flex-wrap:wrap}.dsel label{display:flex;align-items:center;gap:2px;font-size:.85rem}
#nav{position:fixed;inset:auto 0 0 0;display:flex;background:var(--sf);border-top:1px solid var(--ln);padding-bottom:env(safe-area-inset-bottom,0);z-index:10}
#nav button{flex:1;border:0;background:none;color:var(--mut);padding:6px 2px;min-height:56px;font:inherit;font-size:.8rem;cursor:pointer;display:flex;flex-direction:column;align-items:center}
#nav button[aria-current=page]{color:var(--ac);font-weight:700}
#nav b{font-size:1.2rem;line-height:1.2}
.mb{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;justify-content:center;z-index:30}
.md{background:var(--sf);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:16px 16px 0 0;padding:14px}
.md .rw,.md label.f{margin-bottom:8px}
.big{font-size:1.4rem;font-weight:700;text-align:center;margin:12px 0}
#toast{position:fixed;inset-inline:16px;bottom:calc(76px + env(safe-area-inset-bottom,0));max-width:420px;margin-inline:auto;background:var(--ink);color:var(--bg);border-radius:10px;padding:10px 14px;text-align:center;opacity:0;pointer-events:none;transition:opacity .2s;z-index:40}
#toast.on{opacity:1}
body.focus #nav,body.focus .hf{display:none}
.note{color:var(--mut);font-size:.88rem}
@media(prefers-reduced-motion:reduce){.rf,#toast{transition:none}}
</style>
</head>
<body>
<main id="app"></main>
<nav id="nav" aria-label="التنقل"></nav>
<div id="modal"></div>
<div id="toast" role="status" aria-live="polite"></div>
<script>
'use strict';
/* ===== الحالة والتخزين ===== */
const K='planner-v1';
const TYPES=['عام','مذاكرة','ذكر','صلاة'];
const CATS=['أذكار الصباح','أذكار المساء','أذكار بعد الصلاة','أذكار قبل النوم','أخرى'];
const PR=[['Fajr','الفجر'],['Dhuhr','الظهر'],['Asr','العصر'],['Maghrib','المغرب'],['Isha','العشاء']];
const METHODS=[[5,'الهيئة المصرية'],[4,'أم القرى'],[3,'رابطة العالم الإسلامي'],[2,'أمريكا الشمالية'],[1,'كراتشي'],[8,'الخليج'],[9,'الكويت'],[10,'قطر']];
let D={tasks:[],days:{},snap:{},alarms:[],pt:null,snz:[],fired:{d:'',k:{}},first:'',
 set:{theme:'auto',ws:0,study:25,brk:5,sound:'bell',vol:.7,dur:10,notif:true,city:'',country:'',method:5,man:{},pa:{},dp:{'عام':3,'مذاكرة':10,'ذكر':2,'صلاة':3}}};
const pad=n=>(n<10?'0':'')+n;
const dkey=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const today=()=>dkey(new Date());
const pk=k=>{const a=k.split('-');return new Date(+a[0],+a[1]-1,+a[2]);};
const addD=(k,n)=>{const d=pk(k);d.setDate(d.getDate()+n);return dkey(d);};
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>'t'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
function save(){try{localStorage.setItem(K,JSON.stringify(D));}catch(e){toast('تعذّر الحفظ. صدّر نسخة احتياطية.');}}
function load(){
  try{const d=JSON.parse(localStorage.getItem(K));if(d&&Array.isArray(d.tasks)){const s=Object.assign({},D.set,d.set||{});D=Object.assign(D,d);D.set=s;D.set.dp=Object.assign({'عام':3,'مذاكرة':10,'ذكر':2,'صلاة':3},s.dp||{});}}catch(e){}
  if(!D.tasks.length)seed();
  if(!D.first)D.first=today();
  snaps();save();
}
function seed(){
  const m=(name,type,time,max,x)=>Object.assign({id:uid(),name,type,time,end:'',max,desc:'',dow:[],alarm:false},x||{});
  D.tasks=[m('الاستيقاظ وترتيب السرير','عام','06:30',2),m('غسل الوجه والأسنان','عام','06:35',3),
   m('أذكار الصباح','ذكر','06:50',2,{cat:CATS[0],alarm:true})]
   .concat(PR.map(p=>m('صلاة '+p[1],'صلاة','',3,{prayer:p[0]})))
   .concat([m('كتابة الواجب','عام','16:30',3),m('المذاكرة','مذاكرة','17:00',10,{end:'18:00',alarm:true}),
   m('أذكار المساء','ذكر','17:30',2,{cat:CATS[1],alarm:true}),m('ورد القرآن','عام','20:00',3),
   m('أذكار قبل النوم','ذكر','21:30',2,{cat:CATS[3],alarm:true})]);
}
/* ===== الحساب (منفصل عن الواجهة) ===== */
function liveTasks(k){const dw=pk(k).getDay();return D.tasks.filter(t=>!t.dow||!t.dow.length||t.dow.includes(dw));}
function snaps(){const td=today();let k=D.first,i=0;while(k<td&&i<800){if(!D.snap[k])D.snap[k]=liveTasks(k).map(t=>({id:t.id,name:t.name,type:t.type,max:t.max,cat:t.cat,prayer:t.prayer,time:t.time}));k=addD(k,1);i++;}}
function dayTasks(k){return(k<today()&&D.snap[k])?D.snap[k]:liveTasks(k);}
function rec(k,id){return(D.days[k]&&D.days[k][id])||{};}
function setRec(k,id,o){D.days[k]=D.days[k]||{};D.days[k][id]=Object.assign({},D.days[k][id],o);save();}
function earned(t,r){return r.done?Math.min(t.max,Math.max(0,+r.pts||0)):0;}
function summary(k){
  let due=0,got=0,dn=0,best=null;const ts=dayTasks(k);
  ts.forEach(t=>{const r=rec(k,t.id),e=earned(t,r);due+=t.max;got+=e;
    if(r.done){dn++;const ra=t.max?e/t.max:0;if(!best||ra>best.ra||(ra===best.ra&&e>best.e))best={n:t.name,e,ra};}});
  return{due,got,lost:due-got,pct:due?Math.round(got/due*1000)/10:0,dn,un:ts.length-dn,best,n:ts.length};
}
function span(mode,off){
  const td=pk(today());
  if(mode==='w'){const st=addD(dkey(td),-((td.getDay()-D.set.ws+7)%7)+off*7);return[0,1,2,3,4,5,6].map(i=>addD(st,i));}
  const m=new Date(td.getFullYear(),td.getMonth()+off,1),n=new Date(m.getFullYear(),m.getMonth()+1,0).getDate();
  return Array.from({length:n},(_,i)=>dkey(new Date(m.getFullYear(),m.getMonth(),i+1)));
}
function ptime(p){const k=today();if(D.pt&&D.pt.id.indexOf(k)===0&&D.pt.t[p])return D.pt.t[p];return D.set.man[p]||'';}
function typeSum(k,type){let g=0,d=0;dayTasks(k).forEach(t=>{if(t.type===type){d+=t.max;g+=earned(t,rec(k,t.id));}});return{got:g,due:d};}
function subjTotals(ks){const td=today(),o={};ks.forEach(k=>{if(k<D.first||k>td)return;dayTasks(k).forEach(t=>{if(t.type!=='مذاكرة')return;const x=o[t.name]=o[t.name]||{got:0,due:0};x.due+=t.max;x.got+=earned(t,rec(k,t.id));});});
  return Object.keys(o).map(n=>({n,got:o[n].got,due:o[n].due,pct:o[n].due?Math.round(o[n].got/o[n].due*1000)/10:0})).sort((a,b)=>b.got-a.got);}
//#CORE_END
/* ===== الصوت والإشعارات ===== */
let SWR=null,WL=null,UNL=false,ringT=null,ringK='';const AU={};
const SND={bell:[[880,.25],[1175,.25],[1568,.5]],beep:[[1000,.15],[0,.1],[1000,.15],[0,.1],[1000,.15]],soft:[[523,.3],[659,.3],[784,.3],[1047,.6]]};
function wav(pat){
  const sr=22050,gap=.7;let n=Math.round(gap*sr);pat.forEach(p=>{n+=Math.round(p[1]*sr);});
  const b=new ArrayBuffer(44+n*2),v=new DataView(b),w=(o,t)=>{for(let i=0;i<t.length;i++)v.setUint8(o+i,t.charCodeAt(i));};
  w(0,'RIFF');v.setUint32(4,36+n*2,true);w(8,'WAVEfmt ');v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,1,true);v.setUint32(24,sr,true);v.setUint32(28,sr*2,true);v.setUint16(32,2,true);v.setUint16(34,16,true);w(36,'data');v.setUint32(40,n*2,true);
  let o=44;pat.forEach(p=>{const m=Math.round(p[1]*sr);for(let i=0;i<m;i++){let x=0;if(p[0]){const t=i/sr,env=Math.min(1,t/.02)*Math.min(1,(p[1]-t)/.05);x=Math.sin(2*Math.PI*p[0]*t)*env*.9;}v.setInt16(o,x*32767,true);o+=2;}});
  return URL.createObjectURL(new Blob([b],{type:'audio/wav'}));}
function initAudio(){try{Object.keys(SND).forEach(k=>{const a=new Audio(wav(SND[k]));a.loop=true;a.preload='auto';AU[k]=a;});}catch(e){}}
function unlock(){
  if(UNL)return;UNL=true;const u=$('#unl');if(u)u.remove();
  Object.keys(AU).forEach(k=>{const a=AU[k];a.muted=true;const p=a.play();
    if(p&&p.then)p.then(()=>{if(!(ringT&&ringK===k)){a.pause();a.currentTime=0;}a.muted=false;}).catch(()=>{a.muted=false;UNL=false;});});}
function ring(kind,secs){
  stopRing();const k=AU[kind]?kind:'bell',a=AU[k];ringK=k;
  if(a){a.muted=false;a.volume=Math.max(.05,Math.min(1,D.set.vol));a.currentTime=0;const p=a.play();if(p&&p.catch)p.catch(()=>{UNL=false;toast('اضغطي «إعادة الصوت» لتشغيله.');});}
  ringT=setTimeout(stopRing,secs*1000);
  try{if(navigator.vibrate)navigator.vibrate([300,150,300]);}catch(e){}}
function stopRing(){clearTimeout(ringT);ringT=null;Object.keys(AU).forEach(k=>{try{AU[k].pause();AU[k].currentTime=0;}catch(e){}});}
function notify(title,body){
  if(!D.set.notif||!('Notification' in window)||Notification.permission!=='granted')return;
  try{if(SWR)SWR.showNotification(title,{body,tag:title+body,vibrate:[200,100,200],icon:ICON,requireInteraction:true,renotify:true});else new Notification(title,{body});}catch(e){}}
function wake(on){try{if(on&&navigator.wakeLock){navigator.wakeLock.request('screen').then(l=>{WL=l;}).catch(()=>{});}else if(WL){WL.release();WL=null;}}catch(e){}}
let toastT;function toast(m){const e=$('#toast');e.textContent=m;e.classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>e.classList.remove('on'),2600);}
const $=s=>document.querySelector(s);
/* ===== التنبيهات ===== */
let AL=null;
function fire(label,kind,secs,canSnooze){
  AL={label,canSnooze,kind:kind||D.set.sound,secs:secs||D.set.dur};ring(AL.kind,AL.secs);notify('تنبيه',label);
  openM(`<div class="md" role="alertdialog" aria-label="تنبيه"><p class="big">${esc(label)}</p><div class="rw c"><button class="btn pri" data-a="stopA">إيقاف</button><button class="btn" data-a="playA">🔊 إعادة الصوت</button>${canSnooze?'<button class="btn" data-a="snz">تأجيل 5 دقائق</button>':''}</div></div>`);}
function items(){
  const k=today(),dw=new Date().getDay(),out=[];
  PR.forEach(p=>{if(D.set.pa[p[0]]!==false){const tm=ptime(p[0]);if(tm)out.push({id:'p'+p[0],time:tm,label:'حان وقت صلاة '+p[1]});}});
  D.tasks.forEach(t=>{if(t.alarm&&t.time&&!t.prayer&&(!t.dow.length||t.dow.includes(dw))&&!rec(k,t.id).done)out.push({id:'k'+t.id,time:t.time,label:t.name});});
  D.alarms.forEach(a=>{if(a.on&&(!a.days.length||a.days.includes(dw)))out.push({id:'a'+a.id,time:a.time,label:a.label||'منبه'});});
  return out;}
function check(){
  const now=new Date(),k=today();if(D.fired.d!==k)D.fired={d:k,k:{}};
  const nm=now.getHours()*60+now.getMinutes();
  items().forEach(i=>{const a=i.time.split(':'),m=+a[0]*60+ +a[1],key=i.id+i.time;
    if(nm>=m&&nm-m<=5&&!D.fired.k[key]){D.fired.k[key]=1;save();fire(i.label,null,null,true);}});
  const n=D.snz.length;D.snz=D.snz.filter(z=>{if(Date.now()>=z.ts){fire(z.label,null,null,true);return false;}return true;});
  if(n!==D.snz.length)save();}
/* ===== مؤقت المذاكرة ===== */
const T={mode:'study',run:false,left:25*60,end:0,iv:null};
const tDur=m=>(m==='study'?D.set.study:D.set.brk)*60;
const fmt=s=>pad(Math.floor(s/60))+':'+pad(s%60);
function tStart(){unlock();if(T.left<=0)T.left=tDur(T.mode);T.end=Date.now()+T.left*1000;T.run=true;clearInterval(T.iv);T.iv=setInterval(tTick,500);wake(true);
  notify(T.mode==='study'?'بدأت جلسة المذاكرة':'بدأت الراحة',fmt(T.left));}
function tPause(){T.left=Math.max(0,Math.round((T.end-Date.now())/1000));T.run=false;clearInterval(T.iv);wake(false);}
function tTick(){
  T.left=Math.max(0,Math.round((T.end-Date.now())/1000));
  const e=$('#tm');if(e)e.textContent=fmt(T.left);document.title=fmt(T.left)+' | خطتي اليومية';
  if(T.left<=0){clearInterval(T.iv);T.run=false;wake(false);document.title='خطتي اليومية';
    if(T.mode==='study'){fire('انتهى وقت المذاكرة. خذ راحة.',D.set.sound,D.set.dur,false);T.mode='brk';}
    else{fire('انتهت الراحة. ارجع للمذاكرة.','beep',6,false);T.mode='study';}
    T.left=tDur(T.mode);render();}}
/* ===== مواقيت الصلاة ===== */
function fetchPT(force){
  const s=D.set;if(!s.city||!s.country)return;const k=today(),id=k+'|'+s.city+'|'+s.country+'|'+s.method;
  if(!force&&D.pt&&D.pt.id===id)return;const d=k.split('-');
  fetch('https://api.aladhan.com/v1/timingsByCity/'+d[2]+'-'+d[1]+'-'+d[0]+'?city='+encodeURIComponent(s.city)+'&country='+encodeURIComponent(s.country)+'&method='+s.method)
  .then(r=>r.json()).then(j=>{const t=j.data.timings,o={};PR.forEach(p=>{o[p[0]]=String(t[p[0]]).slice(0,5);});D.pt={id,t:o};save();render();toast('تم تحديث مواقيت الصلاة.');})
  .catch(()=>toast('تعذّر جلب المواقيت. أدخلها يدوياً في صفحة الصلاة.'));}
function nextP(){
  const n=new Date(),nm=n.getHours()*3600+n.getMinutes()*60+n.getSeconds();let b=null;
  PR.forEach(p=>{const t=ptime(p[0]);if(!t)return;const a=t.split(':'),s=+a[0]*3600+ +a[1]*60;if(s>nm&&(!b||s<b.s))b={n:p[1],s};});
  if(!b)return'لا توجد صلاة متبقية اليوم، أو لم تُحدَّد المواقيت.';
  const d=b.s-nm;return`الصلاة القادمة: ${b.n} بعد ${Math.floor(d/3600)} س و ${Math.floor(d%3600/60)} د`;}
/* ===== الواجهة ===== */
const V={tab:'today',day:today(),filter:'all',ev:{mode:'w',off:0},focus:false,ft:''};
const TABS=[['today','☀','اليوم'],['timer','⏱','المذاكرة'],['prayer','🕌','الصلاة'],['eval','📊','التقييم'],['set','⚙','الإعدادات']];
function fd(k,o,loc){try{return new Intl.DateTimeFormat(loc||'ar-u-nu-latn',o).format(pk(k));}catch(e){return k;}}
function row(t,k,ex){
  const r=rec(k,t.id),tm=t.prayer?(k===today()?ptime(t.prayer):''):t.time;
  const meta=[tm?(t.end&&!t.prayer?tm+' - '+t.end:tm):'',t.type==='ذكر'&&t.cat?t.cat:'',t.reps?'× '+t.reps:'',t.desc||''].filter(Boolean).map(esc).join(' | ');

    case'playA':if(AL)ring(AL.kind,AL.secs);break;
    case'unlock':break;
    case'sadd':{const nm=$('#s-name').value.trim(),mx=parseFloat($('#s-max').value);if(!nm){toast('اكتبي اسم المادة.');break;}
      D.tasks.push({id:uid(),name:nm,type:'مذاكرة',time:'',end:'',max:isNaN(mx)?D.set.dp['مذاكرة']:mx,desc:'',dow:[],alarm:false});save();render();toast('أُضيفت المادة.');break;}
    case'spreset':{const have=D.tasks.filter(t=>t.type==='مذاكرة').map(t=>t.name);let n=0;
      ['الإنجليزي','العربي','الألماني','الماث','الساينس','الدين','ورد القرآن','الدراسات','ICT'].forEach(x=>{if(have.indexOf(x)<0){D.tasks.push({id:uid(),name:x,type:'مذاكرة',time:'',end:'',max:D.set.dp['مذاكرة'],desc:'',dow:[],alarm:false});n++;}});
      save();render();toast(n?'أُضيفت '+n+' مواد.':'المواد موجودة بالفعل.');break;}
    case'imp':$('#impf').click();break;
  }}
function onChange(e){
  const t=e.target,a=t.dataset.a,s=t.dataset.s,row=t.closest('.row');
  if(t.id==='impf'){const f=t.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!Array.isArray(d.tasks))throw 0;if(!confirm('سيُستبدل ما في هذا الجهاز بالبيانات المستوردة. متابعة؟'))return;D=Object.assign(D,d);D.set=Object.assign({},D.set,d.set||{});save();applyTheme();render();toast('تم الاستيراد.');}catch(x){toast('ملف غير صالح.');}};r.readAsText(f);return;}
  if(a==='tick'){const id=row.dataset.t,k=V.day,tk=dayTasks(k).find(x=>x.id===id),r=rec(k,id);
    setRec(k,id,{done:t.checked,pts:t.checked?(r.pts!=null?r.pts:tk.max):r.pts});render();}
  else if(a==='palarm'){D.set.pa[t.dataset.p]=t.checked;save();}
  else if(a==='man'){D.set.man[t.dataset.p]=t.value;save();render();}
  else if(a==='alon'){D.alarms.find(x=>x.id===row.dataset.id).on=t.checked;save();}
  else if(a==='ft'){V.ft=t.value;}
  else if(t.dataset.dp){D.set.dp[t.dataset.dp]=parseFloat(t.value)||0;save();}
  else if(s){let v=t.type==='checkbox'?t.checked:(t.type==='number'||t.type==='range'||s==='ws'||s==='method')?parseFloat(t.value):t.value.trim?t.value.trim():t.value;
    if(t.type==='number'&&(isNaN(v)||v<1))v=1;D.set[s]=v;save();
    if(s==='theme')applyTheme();if(s==='city'||s==='country'||s==='method')fetchPT(true);
    if((s==='study'||s==='brk')&&!T.run){T.left=tDur(T.mode);render();}if(s==='ws'){V.ev.off=0;}}}
function onInput(e){
  const t=e.target;if(t.dataset.a!=='pts')return;const row=t.closest('.row'),id=row.dataset.t,tk=dayTasks(V.day).find(x=>x.id===id);
  let v=parseFloat(t.value);if(isNaN(v))v=0;if(v>tk.max){v=tk.max;t.value=v;}if(v<0){v=0;t.value=0;}
  setRec(V.day,id,{pts:v});updSum();}
/* ===== الإقلاع ===== */
function boot(){
  load();applyTheme();
  $('#app').addEventListener('click',onClick);$('#nav').addEventListener('click',onClick);$('#modal').addEventListener('click',onClick);
  $('#app').addEventListener('change',onChange);$('#app').addEventListener('input',onInput);
  document.addEventListener('click',unlock);
  document.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('#modal').innerHTML)closeM();});
  document.addEventListener('visibilitychange',()=>{if(!document.hidden){check();if(T.run)tTick();}});
  initAudio();render();fetchPT();let last=today();
  setInterval(()=>{check();const n=$('#nx');if(n)n.textContent=nextP();
    if(today()!==last){const f=V.day===last;last=today();snaps();save();if(f)V.day=last;fetchPT();render();}},1000);
  pwa();}
function star(c,x,y,R,r){c.beginPath();for(let i=0;i<10;i++){const a=-Math.PI/2+i*Math.PI/5,q=i%2?r:R;c[i?'lineTo':'moveTo'](x+q*Math.cos(a),y+q*Math.sin(a));}c.closePath();c.fill();}
function icon(n){const c=document.createElement('canvas');c.width=c.height=n;const x=c.getContext('2d');x.fillStyle='#6b4fd3';x.fillRect(0,0,n,n);x.fillStyle='#f2b01e';star(x,n/2,n*.53,n*.3,n*.12);return c.toDataURL('image/png');}
let ICON='';
function pwa(){
  try{ICON=icon(192);const l=document.createElement('link');l.rel='apple-touch-icon';l.href=icon(180);document.head.appendChild(l);
    if(location.protocol.indexOf('http')===0){
      const p=location.origin+location.pathname,m={name:'خطتي اليومية',short_name:'خطتي',lang:'ar',dir:'rtl',display:'standalone',start_url:p,scope:p.replace(/[^\/]*$/,''),background_color:'#f3f1fa',theme_color:'#6b4fd3',
        icons:[{src:ICON,sizes:'192x192',type:'image/png',purpose:'any'},{src:icon(512),sizes:'512x512',type:'image/png',purpose:'any'}]};
      const k=document.createElement('link');k.rel='manifest';k.href=URL.createObjectURL(new Blob([JSON.stringify(m)],{type:'application/manifest+json'}));document.head.appendChild(k);
      if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').then(()=>navigator.serviceWorker.ready).then(r=>{SWR=r;}).catch(()=>{});}
  }catch(e){}}
if(typeof document!=='undefined'&&document.body&&!window.__TEST__)boot();
